# 境界ルール: components/ui（shadcn 汎用部品）はドメインを知らない。
# この層の価値は「何も知らないこと」それ自体にある。Button が Note を知った
# 瞬間、Button はログイン画面で使えなくなり、付箋の仕様変更が全ボタンに波及する。
# 許可: lib/（cn 等のドメイン非依存ユーティリティ）と components/ui 内の相互参照。
id: ui-must-not-know-domain
language: typescript
severity: error
files:
  - components/ui/**
message: components/ui から contracts・features・app を import しない
note: |
  汎用部品にドメインの都合を持ち込みたくなったら、それは features 側に
  ラッパー部品を作るサイン。components/ui は「どのプロダクトでも使える形」を保つ。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/(contracts|features|app)/"
---
id: ui-must-not-know-domain-tsx
language: tsx
severity: error
