# 境界ルール: contracts/ は全レイヤー共通の語彙であり、何も import しない
# （zod 等の外部パッケージと contracts 内の相対 import のみ許可）。
# 実装層（app / components / features / lib / workers）を知った瞬間に
# 「境界の真実」ではなくなり、実装の変更が語彙を壊す方向の結合が生まれる。
id: contracts-import-nothing
language: typescript
severity: error
files:
  - contracts/**
message: contracts/ から app・components・features・lib・workers を import しない
note: |
  contracts/ は境界スキーマ（zod）の置き場で、全レイヤーから import される側。
  実装層に依存させたいものが出てきたら、それは contracts に置くべきではない。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/(app|components|features|lib|workers)/"
---
