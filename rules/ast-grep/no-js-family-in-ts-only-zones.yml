# 境界ルール: features / app は TypeScript 専用ゾーン。JS ファミリ
# （.js / .jsx / .mjs / .cjs）のソースを置かない。
#
# 帯規則・feature 間一方通行・deep import 禁止は language: typescript /
# tsx で書かれており、ast-grep は JS ファミリ拡張子を JavaScript として
# 別言語で解釈するため、これらのファイルは import 境界検査から丸ごと
# 外れる（攻撃的検証で実証済み）。JS ファミリを features / app で全面
# 禁止して、境界検査の対象外ファイルが生まれる余地を塞ぐ（現状ゼロ）。
# program ノードにマッチさせ、該当拡張子のファイルが存在するだけで fail
# にする。検知の regression テストは scripts/band-import-rules.spec.ts。
id: no-js-family-in-ts-only-zones
language: javascript
severity: error
files:
  - features/**
  - app/**
message: features / app は TypeScript 専用。.js/.jsx/.mjs/.cjs を置かない（import 境界検査の対象外になる）
note: |
  .ts / .tsx に変換する。設定ファイル等の JS はリポジトリルートに置く。
rule:
  kind: program
