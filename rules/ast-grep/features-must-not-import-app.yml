# 境界ルール: features/ は app/（ルーティング層）を知らない。
# ドメイン部品が URL 構造・ページ配線を知ると、画面構成の変更（ルート分割・
# URL 変更）がドメイン層に波及する。app/ は Next.js という詳細への「殻」であり、
# 資産は features/ に置く。共有したいものが app/ にあるなら features/lib へ昇格する。
id: features-must-not-import-app
language: typescript
severity: error
files:
  - features/**
message: features/ から app/ を import しない（依存は app → features の一方向）
note: |
  app/ 配下を import してよいのは app/ 配下だけ。features から欲しくなった
  モジュールは、features か lib へ移してから使う。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/app/"
---
id: features-must-not-import-app-tsx
language: tsx
severity: error
files:
  - features/**
message: features/ から app/ を import しない（依存は app → features の一方向）
note: |
  app/ 配下を import してよいのは app/ 配下だけ。features から欲しくなった
  モジュールは、features か lib へ移してから使う。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/app/"
