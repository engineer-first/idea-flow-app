# 境界ルール: features / app で CommonJS の動的モジュール読込を使わない。
#
# import 境界検査（帯規則・feature 間一方通行・deep import 禁止）は
# import_statement / export_statement しか照合しないため、CommonJS の
# require(...) と import-equals（`import X = require(...)`）は全ルールの
# 死角になる（攻撃的検証で実証済み。下帯から上帯・公開境界へ実行時 /
# コンパイル時に到達できてしまう）。動的 import() を塞いだのと同じ
# fail-closed 方針で、これらの構文自体を禁止する（現状の実使用ゼロ）。
# 直接呼び出し（require(...)）だけでなく、識別子 require の出現そのものを
# 禁止する（`const r = require; r("../x")` の別名経由呼び出しも塞ぐ。
# features / app は ESM ゾーンで require の正当な用途がない）。
# 検知の regression テストは scripts/band-import-rules.spec.ts。
id: no-commonjs-require-in-features-and-app
language: typescript
severity: error
files:
  - features/**
  - app/**
message: features / app では require を使わない（import 境界検査の死角になる）
note: |
  静的 import に書き換える。features / app は ESM 前提の TS ゾーン。
rule:
  kind: identifier
  regex: "^require$"
---
id: no-commonjs-require-in-features-and-app-tsx
language: tsx
severity: error
files:
  - features/**
  - app/**
message: features / app では require を使わない（import 境界検査の死角になる）
note: |
  静的 import に書き換える。features / app は ESM 前提の TS ゾーン。
rule:
  kind: identifier
  regex: "^require$"
---
# `import X = require("...")`（import-equals）。require の指定子は source
# フィールドではなく import_require_clause 内にあり、has:{field:source} の
# 帯規則が原理的に届かない。構文ごと禁止する。
id: no-commonjs-import-require-in-features-and-app
language: typescript
severity: error
files:
  - features/**
  - app/**
message: features / app では import 〜 = require(...) を使わない（import 境界検査の死角になる）
note: |
  静的 import（import X from "..."）に書き換える。
rule:
  kind: import_statement
  has:
    kind: import_require_clause
---
id: no-commonjs-import-require-in-features-and-app-tsx
language: tsx
severity: error
files:
  - features/**
  - app/**
message: features / app では import 〜 = require(...) を使わない（import 境界検査の死角になる）
note: |
  静的 import（import X from "..."）に書き換える。
rule:
  kind: import_statement
  has:
    kind: import_require_clause
