# 境界ルール: データ（D1・RoomDO）への到達は api-worker の HTTP / WebSocket 境界を
# 経由する。workers/ の実装を UI 側から import できてしまうと、この境界が
# コンパイル時に消滅するため、import の形そのものを禁止する。
id: no-workers-import-outside-workers
language: typescript
severity: error
files:
  - app/**
  - lib/**
  - components/**
  - contracts/**
message: workers/ のモジュールを app・lib・components・contracts から直接 import しない
note: |
  データ（D1・RoomDO）への到達は必ず api-worker の HTTP / WebSocket 境界を経由する。
  境界を流れる型・スキーマは contracts/ に定義し、両側からそちらを import する。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/workers/"
---
id: no-workers-import-outside-workers-tsx
language: tsx
severity: error
files:
  - app/**
  - lib/**
  - components/**
  - contracts/**
message: workers/ のモジュールを app・lib・components・contracts から直接 import しない
note: |
  データ（D1・RoomDO）への到達は必ず api-worker の HTTP / WebSocket 境界を経由する。
  境界を流れる型・スキーマは contracts/ に定義し、両側からそちらを import する。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/workers/"
