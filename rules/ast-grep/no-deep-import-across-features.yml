# 境界ルール: feature の公開境界は index.ts。内部実装への深い import を禁止する。
# 「公開境界では明示的な型を優先する」の feature 単位への適用。内部ファイルへ
# 直接依存されると、feature 内のファイル構成を変えるだけで外部が壊れ、
# feature の再構成（リファクタリング）が事実上不可能になる。
#
# 同一 feature 内のファイル同士は相対 import（"./xxx"）を使う。これにより
# 「相対 = feature 内部 / @/features/<name> = 他 feature の公開境界」と
# import 文の形だけで依存の種類が読めるようになる。
id: no-deep-import-across-features
language: typescript
severity: error
files:
  - features/**
  - app/**
message: feature の内部実装に直接依存しない。@/features/<name>（index.ts）から import する
note: |
  外から使いたいものは、その feature の index.ts に明示的に export する。
  同一 feature 内からは相対 import（"./xxx"）を使う。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/features/[^/\"']+/"
---
id: no-deep-import-across-features-tsx
language: tsx
severity: error
files:
  - features/**
  - app/**
message: feature の内部実装に直接依存しない。@/features/<name>（index.ts）から import する
note: |
  外から使いたいものは、その feature の index.ts に明示的に export する。
  同一 feature 内からは相対 import（"./xxx"）を使う。
rule:
  any:
