# 境界ルール: features / app の import 指定子に連続スラッシュ（//）を含めない。
#
# 攻撃的検証で、alias の非正規化形（`@//features/x`・`@/features//x`）が
# no-deep-import の regex（feature 名の直後に単一 / を要求）をすり抜けて
# feature 内部へ直行できることが実証された。正規のモジュール指定子に
# 連続スラッシュが現れることはない（http:// のような protocol import も
# features / app では使わない）ので、// を形ごと禁止して塞ぐ。
# 相対の `..//box/` も同時に捕まる（帯規則の正規形要求と二重の防御）。
# 検知の regression テストは scripts/band-import-rules.spec.ts。
id: no-double-slash-import-specifier
language: typescript
severity: error
files:
  - features/**
  - app/**
message: import 指定子に連続スラッシュ（//）を書かない（非正規化パスで境界検査をすり抜けさせない）
note: |
  正規形のパスに直す（alias は @/features/<name>/...、相対は ../<box>/...）。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "//"
---
id: no-double-slash-import-specifier-tsx
language: tsx
severity: error
files:
  - features/**
  - app/**
message: import 指定子に連続スラッシュ（//）を書かない（非正規化パスで境界検査をすり抜けさせない）
note: |
  正規形のパスに直す（alias は @/features/<name>/...、相対は ../<box>/...）。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "//"
