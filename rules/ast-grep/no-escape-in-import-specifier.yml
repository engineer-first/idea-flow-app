# 境界ルール: features / app の import 指定子にバックスラッシュ（\）を含めない。
#
# 全ての境界規則（帯・deep-import・one-way・unregistered・double-slash）は
# has:{field:source} の regex を「生のソーステキスト」に照合するが、
# モジュール指定子はコンパイラ / バンドラがエスケープ解決後の値で解決する。
# このため先頭文字をエスケープした "\../containers/board" や unicode
# エスケープした "@/features/..." は、生テキストが規則の要求する
# literal（^["']\. や [.@]/features/）に一致せず、全 source-regex 規則を
# 一斉に素通りできる（攻撃的検証で実証済み。非正規化パスと同クラスの死角）。
# JS 文字列のエスケープは必ずバックスラッシュを含み、正規のモジュール
# 指定子にバックスラッシュが現れることはないため、形ごと禁止して塞ぐ。
# 検知の regression テストは scripts/band-import-rules.spec.ts。
id: no-escape-in-import-specifier
language: typescript
severity: error
files:
  - features/**
  - app/**
message: import 指定子にバックスラッシュ（\）を書かない（エスケープで境界検査をすり抜けさせない）
note: |
  指定子は正規形のリテラルで書く（alias は @/features/<name>/...、相対は
  ../<box>/...）。エスケープ・unicode エスケープは使わない。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "\\\\"
---
id: no-escape-in-import-specifier-tsx
language: tsx
severity: error
files:
  - features/**
  - app/**
message: import 指定子にバックスラッシュ（\）を書かない（エスケープで境界検査をすり抜けさせない）
note: |
  指定子は正規形のリテラルで書く（alias は @/features/<name>/...、相対は
  ../<box>/...）。エスケープ・unicode エスケープは使わない。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "\\\\"
