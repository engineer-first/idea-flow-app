# 境界ルール: features / app の動的 import() は、文字列リテラル1つだけを
# 引数に取る形に限定して許可する（2026-07-14 緩和）。
#
# import 境界の機械検査（帯規則・feature 間一方通行・deep import 禁止）は
# import 文（import_statement / export_statement）しか見ていないため、
# 動的 import() は全ルールの共通の死角になる（攻撃的検証で実証済み）。
# ただし危険なのは「静的に読めない引数」（変数・式・テンプレートリテラル）
# だけで、文字列リテラル1つはソース上に平文で残るため、帯・feature 境界の
# 妥当性はコードレビューで確認できる（declare module の型結合を許容した
# no-module-augmentation-in-features 撤廃と同じ判断）。next/dynamic 等の
# 遅延読み込みは常にリテラル引数を要求する（バンドラの静的解析の前提）ので、
# この緩和で実務上のユースケースは塞がない。
#
# 「文字列リテラル1つ」は pattern + constraints で判定する（kind: call_expression
# + has: field: arguments の組み合わせは has が対象ノードの子孫まで探索するため、
# `import(cond ? "./a" : "./b")` のような三項演算子・文字列結合に埋め込まれた
# リテラルを誤って「安全な引数」と判定してしまう。pattern: "import($ARG)" は
# 引数ノードそのものを $ARG に束縛するため、この偽装を正しく非リテラル
# として検知する）。検知の regression テストは scripts/band-import-rules.spec.ts。
id: no-dynamic-import-in-features-and-app
language: typescript
severity: error
files:
  - features/**
  - app/**
message: features / app の動的 import() は文字列リテラル1つだけ許可（変数・式は境界検査の死角になる）
note: |
  import(path) の path は変数・式・テンプレートリテラルではなく、文字列
  リテラルを直接書く。リテラルが指す先（帯・feature 境界）の妥当性は
  機械検査の対象外なので、コードレビューで確認する。
rule:
  pattern: import($ARG)
constraints:
  ARG:
    not:
      all:
        - kind: string
        - regex: "^[\"'](\\.{1,2}/|@/|[\\w@])"
---
id: no-dynamic-import-in-features-and-app-tsx
language: tsx
severity: error
files:
