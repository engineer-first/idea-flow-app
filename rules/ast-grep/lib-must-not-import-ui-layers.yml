# 境界ルール: lib/ はドメイン非依存インフラ（api-client / room-client / session）。
# contracts の語彙は使ってよいが、UI 層（app / components / features）は知らない。
# インフラがドメイン UI に依存すると、画面の変更が接続・認証コードを
# 巻き込んで壊す方向の結合が生まれる。React コンポーネントも lib には置かない。
id: lib-must-not-import-ui-layers
language: typescript
severity: error
files:
  - lib/**
message: lib/ から app・components・features を import しない
note: |
  境界を流れる型・スキーマは contracts/ に定義し、lib はそちらだけを import する。
  ドメイン文言・ドメイン UI が必要になったら、それは features 側の持ち物。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/(app|components|features)/"
---
id: lib-must-not-import-ui-layers-tsx
