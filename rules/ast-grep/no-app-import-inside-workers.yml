# 境界ルール（逆方向）: workers/ は UI 層（app/・components/）に依存しない。
# workers が UI 実装を import すると、UI の変更が認可・配信コードを巻き込んで
# 壊す方向の結合が生まれる。境界を流れる型・ロジックは contracts/ に置き、
# workers はそちらだけを import する（lib/ の環境非依存モジュールは共有可）。
id: no-app-import-inside-workers
language: typescript
severity: error
files:
  - workers/**
message: app/・components/ のモジュールを workers/ から直接 import しない
note: |
  境界を流れる型・スキーマ・共有ロジックは contracts/ に定義し、
  workers はそちらを import する。UI 層への依存は境界の逆流であり禁止。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/(app|components)/"
