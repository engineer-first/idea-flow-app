    regex: "[.@]/features/(room|room-lifecycle|auth)[\"'/]"
---
# feature 内は 1 階層のフラット構成なので、"../" が必要になる合法な import は
# 存在しない。相対 import で親をさかのぼると、alias 規約（@/features/<name>）を
# すり抜けて他 feature / 他レイヤーの内部へ直接依存できてしまうため、形で塞ぐ。
id: features-must-not-escape-with-relative-imports
language: typescript
severity: error
files:
  - features/**
message: features 内で "../" import を使わない（@/ alias か同一 feature 内の "./" を使う）
note: |
  他 feature は @/features/<name>（公開境界）、共有インフラは @/lib、
  境界スキーマは @/contracts を import する。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "\\.\\./"
---
id: features-must-not-escape-with-relative-imports-tsx
language: tsx
severity: error
files:
  - features/**
message: features 内で "../" import を使わない（@/ alias か同一 feature 内の "./" を使う）
note: |
  他 feature は @/features/<name>（公開境界）、共有インフラは @/lib、
  境界スキーマは @/contracts を import する。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "\\.\\./"
