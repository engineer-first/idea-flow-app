name: D1 (lobby)
desc: >-
  招待コード → ルーム解決のためのディレクトリ。ルームの中身（メンバー・付箋）の真実は
  RoomDO が持つため、ここには含まれない。RoomDO 側は .tbls/room-do.yml を参照。
  D1 と RoomDO は物理的に別ストレージであり、DBレベルでの結合は存在しない。

dsn: sqlite://tmp/d1-schema.sqlite
docPath: schema-diagrams/d1

er:
  format: svg

# tbls lint（npm run db:schema:lint / CI で実行）。
# コメント必須系のルールは入れない: SQLite にコメント構文がなく、この YAML に
# comments マップを手で保守することになり「生成物に手作業を挟まない」方針に反する。
lint:
  # FK カラムにインデックスが無いと JOIN / 参照整合性チェックが
  # テーブルスキャンになるため、貼り忘れを機械で止める
  requireForeignKeyIndex:
    enabled: true
  # カラム数の上限。超えたら「1テーブルに責務を詰め込みすぎていないか」を
  # 立ち止まって考えるためのガードレール
  columnCount:
    enabled: true
    max: 12
  # 同じ関係の重複定義を検出する
  duplicateRelations:
    enabled: true
