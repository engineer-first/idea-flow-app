name: RoomDO (room内部)
desc: >-
  ルーム1つにつき1つ生成される SQLite-backed Durable Object の内部スキーマ。
  メンバーシップと付箋の確定状態の真実をここで持つ。D1 の rooms.id はこの
  DO インスタンスに対応するが、DBレベルでの結合は存在しない（アプリケーション
  コード上でのみ対応づけられる）。D1 側は .tbls/d1.yml を参照。

dsn: sqlite://tmp/room-do-schema.sqlite
docPath: schema-diagrams/room-do

# schema_version は版管理用の内部テーブルでドメインモデルではないため除外する。
exclude:
  - schema_version

er:
  format: svg
