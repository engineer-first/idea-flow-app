<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="idea-flow-app のドキュメントサイト。PoC の技術解説と実装マップの目次。">
<title>idea-flow-app ドキュメント</title>
<style>
  :root {
    --bg: #F7F8F6;
    --surface: #FFFFFF;
    --ink: #1C2420;
    --muted: #66736C;
    --line: #DDE3DF;
    --accent: #0F766E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121714;
      --surface: #1B221E;
      --ink: #E8ECE9;
      --muted: #96A29B;
      --line: #2A332E;
      --accent: #4FC5B8;
    }
  }
  :root[data-theme="light"] {
    --bg: #F7F8F6;
    --surface: #FFFFFF;
    --ink: #1C2420;
    --muted: #66736C;
    --line: #DDE3DF;
    --accent: #0F766E;
  }
  :root[data-theme="dark"] {
    --bg: #121714;
    --surface: #1B221E;
    --ink: #E8ECE9;
    --muted: #96A29B;
    --line: #2A332E;
    --accent: #4FC5B8;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    line-height: 1.75;
    margin: 0;
    padding: 3.5rem 1.25rem 5rem;
    font-size: 15px;
  }
  main { max-width: 680px; margin: 0 auto; }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 0.4rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    text-wrap: balance;
  }
  .lede { color: var(--muted); margin: 0 0 2.2rem; }

  .toc { display: flex; flex-direction: column; gap: 1rem; margin: 0; padding: 0; list-style: none; }
  .toc a {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.1rem 1.35rem;
    text-decoration: none;
    color: inherit;
  }
  .toc a:hover, .toc a:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  .toc .title {
    font-weight: 700;
    font-size: 1.02rem;
    color: var(--accent);
    display: block;
    margin-bottom: 0.15rem;
  }
  .toc .desc { font-size: 0.88rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">engineer-first / idea-flow-app</p>
  <h1>idea-flow-app ドキュメント</h1>
  <p class="lede">PoC・技術検証に関する解説ページの目次です。</p>

  <ul class="toc">
    <li>
      <a href="./realtime/">
        <span class="title">HTTPしか知らない人のための Supabase Realtime</span>
        <span class="desc">今回の付箋アプリで新しかった WebSocket の部分を、知っている HTTP との差分だけで理解する技術解説。</span>
      </a>
    </li>
    <li>
      <a href="./realtime-poc-map/">
        <span class="title">PoC実装の現在地 — リアルタイム付箋同期</span>
        <span class="desc">poc-realtime-note-sync ブランチの実装マップ。データの流れ2経路と、25ファイルの4層構成を1ページで俯瞰する。</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
