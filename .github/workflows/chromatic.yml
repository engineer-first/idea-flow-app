name: Chromatic

# pull_request イベントでは GitHub が一時的なマージコミットを作るため、
# Chromatic のベースライン特定がずれることがある。公式推奨に従い push で実行する。
# https://www.chromatic.com/docs/github-actions
on: push

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic はベースライン特定に git 履歴全体を使う
          fetch-depth: 0
          # 履歴は checkout 時に取得済みで、後続に git push/fetch はないため
          # トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 差分の合否は Chromatic 側の UI Tests / UI Review ステータスチェックで
          # 管理するため、差分検出だけでこの workflow 自体は失敗させない
          exitZeroOnChanges: true
          # develop へのマージ後は差分を自動承認し、新しいベースラインにする
          autoAcceptChanges: develop

          # ==== コスト削減オプション ====
          #
          # 課金モデル: スナップショット数 = story 数 × viewport 数 × ブラウザ数。
          # viewport / ブラウザ / accessibility テストを追加すると乗算で増えるため、
          # 増やすときは必ず月間消費量を再試算する。
          # https://www.chromatic.com/docs/billing

          # TurboSnap: git 差分と Vite の依存グラフを逆引きし、影響のある story だけ
          # 撮影する。影響のない story はベースラインのコピーとなり課金が通常の 1/5 に
          # なる。Storybook 8+ の Vite はネイティブ対応で、この 1 行だけで有効になる。
          # https://www.chromatic.com/docs/turbosnap
          onlyChanged: true

          # TurboSnap 有効時、「全 story から依存されるが見た目に影響しない」ファイルを
          # 依存追跡から除外し、無駄な全再撮影を減らす。ただし globals.css や
          # preview.tsx を除外するとトークン変更の検出が漏れるので対象は慎重に選ぶ。
          untraced: "package-lock.json"

          # Schema/* stories の入力（migration .sql / tbls 設定 / スキーマ生成
          # スクリプト）は build-storybook 時に生成する静的アセット経由で story に
          # 届くため、Vite の依存グラフに乗らない。externals に載せないと
          # 「migration だけ変えた PR」で schema stories がベースラインのコピーに
          # なり、ER 図の差分検出が働かない。
          externals: |
            workers/migrations/**
            workers/room-do-migrations/**/*.sql
            .tbls/**
            scripts/build-d1-schema.mts
            scripts/build-room-do-schema.mts
            scripts/generate-room-do-migrations.mjs

          # bot が作るブランチではビルド自体をスキップする（スナップショット消費 0。
          # skip はビルドを「スキップ済み」として記録するため、チェックが pending の
          # まま残らない）
          skip: "@(renovate/**|dependabot/**)"

          # アップロード完了時点で workflow を終了し、GitHub Actions の実行時間を
          # 節約する（スナップショット数は減らない。結果は Chromatic が GitHub の
          # ステータスチェックとして直接報告する）
          exitOnceUploaded: true
