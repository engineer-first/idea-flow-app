name: PR Issue Link

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  append-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from branch and append to PR body
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/\d+/);
            if (!match) {
              return;
            }
            const issueNumber = match[0];
            const pr = context.payload.pull_request;
            const body = pr.body ?? "";
            const marker = `<!-- issue-ref:${issueNumber} -->`;
            if (body.includes(marker)) {
              return;
            }
            const newBody = body + `\n\n${marker}\nCloses #${issueNumber}`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: newBody,
            });
