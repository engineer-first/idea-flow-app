name: Docs site preview links

# PR で docs/site 配下の HTML が追加・変更されたとき、githack 経由の
# プレビュー URL を PR コメントとして自動投稿・更新する。デプロイは行わない。
# URL はコミット SHA 固定（rawcdn.githack.com は SHA 付き URL を永続キャッシュ
# するため、push ごとにコメントを新しい SHA の URL で上書きする）。
# 注意: fork からの PR では GITHUB_TOKEN が read-only のためコメントできない。
on:
  pull_request:
    paths:
      - "docs/site/**"
      - ".github/workflows/docs-site-preview.yml"

# コメントの投稿・更新に必要な最小権限。
permissions:
  pull-requests: write

# 同一 PR への連続 push ではコメント更新を1本に絞る。
concurrency:
  group: docs-site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # PR のコードは checkout せず、API 経由で変更ファイル一覧だけを読む。
      - name: Post or update preview links comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- docs-site-preview -->'
            const { owner, repo } = context.repo
            const prNumber = context.payload.pull_request.number
            const headSha = context.payload.pull_request.head.sha

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            })
            const htmlFiles = files.filter(f =>
              f.status !== 'removed' &&
              f.filename.startsWith('docs/site/') &&
              f.filename.endsWith('.html')
            )

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            })
            const existing = comments.find(c => c.body.includes(marker))

            let body
            if (htmlFiles.length === 0) {
              // HTML の変更が PR からなくなった場合は既存コメントだけ書き換える
              if (!existing) return
              body = [
                marker,
                '## 📄 Docs サイトプレビュー',
                '',
                'この PR には現在、プレビュー対象の HTML 変更はありません。',
              ].join('\n')
            } else {
              const rows = htmlFiles.map(f =>
                `| \`${f.filename}\` | [開く](https://rawcdn.githack.com/${owner}/${repo}/${headSha}/${f.filename}) |`
              )
              body = [
                marker,
                '## 📄 Docs サイトプレビュー',
                '',
                `commit \`${headSha.slice(0, 7)}\` 時点のプレビューです。push すると自動で更新されます。`,
                '',
                '| ファイル | プレビュー |',
                '| --- | --- |',
                ...rows,
              ].join('\n')
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body })
            }
