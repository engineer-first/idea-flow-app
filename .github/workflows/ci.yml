name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Create .dev.vars for type generation
        run: cp workers/.dev.vars.example workers/.dev.vars

      - name: Lint & format check
        run: npm run lint -- --reporter=github

      - name: Type check
        run: npm run typecheck

      - name: Check D1 migration numbers
        run: npm run check:migrations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run worker tests (Durable Objects / D1)
        run: npm run test:workers

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf
        env:
          CI: true

