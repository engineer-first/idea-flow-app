name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Create .dev.vars for type generation
        run: cp workers/.dev.vars.example workers/.dev.vars

      - name: Lint & format check
        run: npm run lint -- --reporter=github

      - name: Type check
        run: npm run typecheck

      - name: Check D1 migration numbers
        run: npm run check:migrations

      # マイグレーションから組み立てた実スキーマに対する構造ルールの機械検査
      # （FK インデックス貼り忘れ・テーブル肥大化など）。ルールは .tbls/*.yml。
      - name: Lint database schemas (tbls)
        run: npm run db:schema:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run worker tests (Durable Objects / D1)
        run: npm run test:workers

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf
        env:
          CI: true

  smoke:
    # build がビルド成功しか見ていないのに対し、ここは preview:cf 相当の
    # 環境を実際に起動し、Next.js -> サービスバインディング -> api-worker の
    # 経路が生きているかを検証する。同じチェックはローカルでも
    # `npm run smoke` で再現できる。
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (service binding)
        run: npm run smoke
        env:
          CI: true
