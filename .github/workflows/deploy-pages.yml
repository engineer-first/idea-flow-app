name: Deploy docs site to GitHub Pages

# docs/site/ 配下の静的HTMLだけを GitHub Pages として公開する。
# develop にマージされ、対象ファイルが変わったときに自動デプロイする。
on:
  push:
    branches: [develop]
    paths:
      - "docs/site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# Pages デプロイに必要な最小権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本に絞り、進行中のデプロイはキャンセルする。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
